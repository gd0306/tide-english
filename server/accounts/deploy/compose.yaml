name: tide-accounts
services:
  db:
    # Bookworm avoids recent Alpine syscalls rejected by this host's libseccomp2.3.
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: tide-accounts-db
    network_mode: host
    restart: unless-stopped
    env_file: ./private/postgres.env
    # Suppress value-bearing ERROR/DETAIL/CONTEXT as well as statement/parameter logs.
    command: [postgres, -c, listen_addresses=127.0.0.1, -p, '55439', -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_min_messages=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, log_min_duration_statement=-1, -c, log_min_duration_sample=-1, -c, log_transaction_sample_rate=0, -c, log_duration=off, -c, logging_collector=off]
    volumes:
      - accounts-data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:mode=3777
      - /tmp
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '3'}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 55439 -U postgres -d tide_accounts']
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    # Loaded immutable image identity; environment variables cannot replace it.
    image: sha256:6bd78720dd27616d51b8d581e226f8e424b8fb62fe71b8ece122212678070ad0
    pull_policy: never
    container_name: tide-accounts-api
    network_mode: host
    restart: unless-stopped
    # Compose parses dotenv quoting; CLI helpers use the separate literal env file.
    env_file: ./private/runtime.compose.env
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: '3'}
    depends_on:
      db: {condition: service_healthy}
volumes:
  accounts-data:
    # Retain the failed Alpine initialization volume; never remove it automatically.
    name: tide-accounts-data-bookworm
