# Install only after local readiness, privileges and encrypted recovery check pass.
# This file adds one domain; it does not replace nginx.conf or any other vhost.
server {
    listen 80;
    server_name api.gd306.cn;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tide-accounts-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://api.gd306.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api.gd306.cn;
    ssl_certificate /opt/tide-accounts/letsencrypt/live/api.gd306.cn/fullchain.pem;
    ssl_certificate_key /opt/tide-accounts/letsencrypt/live/api.gd306.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TideAccountsTLS:1m;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 2k;
    client_body_buffer_size 2k;
    client_body_timeout 10s;
    add_header Cache-Control no-store always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    error_page 413 = @too_large;
    error_page 502 504 = @unavailable;
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"request_too_large"}}';
    }
    location @unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"service_unavailable"}}';
    }
    location / {
        proxy_pass http://127.0.0.1:8189;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host api.gd306.cn;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_send_timeout 10s;
        proxy_hide_header Cache-Control;
        proxy_intercept_errors on;
    }
}
